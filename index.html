
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1B5E20">
    <meta name="description" content="Explora lugares turísticos e históricos de Bogotá.">
    <title>Bogotá Explorando</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png"
</head>
<body>
    <header>
        <h1>Bogotá Explorando</h1>
        <p>Descubre lugares turísticos e históricos de la ciudad</p>
    </header>

    <main>
        <section class="busqueda" aria-label="Buscar lugares">
            <label for="buscar">Buscar un lugar de Bogotá</label>
            <input id="buscar" type="search" placeholder="Escribe un nombre o una palabra clave">
        </section>

        <section id="detalle" aria-live="polite" aria-label="Detalle del lugar"></section>
        <section id="lugares" aria-label="Lugares turísticos de Bogotá"></section>
    </main>

    <script src="app.js"></script>
</body>
</html>
